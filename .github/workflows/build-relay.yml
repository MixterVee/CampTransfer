name: Build CampTransfer Relay

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish relay EXE
        run: dotnet publish relay/CampTransferRelay/CampTransferRelay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o relay-publish

      - name: Upload relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampTransfer-Relay-win-x64
          path: relay-publish/CampTransferRelay.exe
