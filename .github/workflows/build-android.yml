name: Build Turtle Transfer Remote Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild exact Turtle Transfer launcher icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="android/CampTransferRemote/app/src/main/res/drawable-nodpi"
          ICON_OUT="$ICON_DIR/turtle_transfer_launcher.png"
          mkdir -p "$ICON_DIR"

          # Remove every old/generated launcher resource so Android cannot fall back
          # to the generic Android Studio icon.
          rm -rf android/CampTransferRemote/app/src/main/res/mipmap-anydpi
          rm -rf android/CampTransferRemote/app/src/main/res/mipmap-anydpi-v26
          rm -f android/CampTransferRemote/app/src/main/res/drawable/ic_transfer.xml
          rm -f android/CampTransferRemote/app/src/main/res/drawable/ic_transfer_background.xml
          rm -f android/CampTransferRemote/app/src/main/res/drawable/ic_transfer_foreground.xml
          rm -f "$ICON_OUT"

          # Same deterministic approach used successfully in EAVdrop:
          # reconstruct the approved artwork from the committed base64 source,
          # then reference that exact PNG directly from AndroidManifest.xml.
          python3 - <<'PY'
          from pathlib import Path
          import base64, struct, zlib

          src = Path('build/turtle-icon/source256-full.b64')
          out = Path('android/CampTransferRemote/app/src/main/res/drawable-nodpi/turtle_transfer_launcher.png')
          raw = ''.join(src.read_text(encoding='utf-8').split())
          data = base64.b64decode(raw, validate=True)

          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Launcher source did not decode to a PNG')

          # Fully validate the PNG chunk stream and CRCs so a damaged icon can
          # never silently make it into the APK again.
          pos = 8
          saw_ihdr = False
          saw_iend = False
          while pos + 12 <= len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              ctype = data[pos+4:pos+8]
              end = pos + 12 + length
              if end > len(data):
                  raise SystemExit(f'Truncated PNG chunk {ctype!r}')
              chunk = data[pos+8:pos+8+length]
              stored_crc = struct.unpack('>I', data[pos+8+length:pos+12+length])[0]
              calc_crc = zlib.crc32(ctype)
              calc_crc = zlib.crc32(chunk, calc_crc) & 0xffffffff
              if stored_crc != calc_crc:
                  raise SystemExit(f'Bad PNG CRC in chunk {ctype!r}')
              if ctype == b'IHDR':
                  saw_ihdr = True
                  width, height = struct.unpack('>II', chunk[:8])
                  if width < 64 or height < 64:
                      raise SystemExit(f'Launcher icon too small: {width}x{height}')
              if ctype == b'IEND':
                  saw_iend = True
                  pos = end
                  break
              pos = end

          if not (saw_ihdr and saw_iend) or pos != len(data):
              raise SystemExit('Invalid or incomplete PNG launcher icon')

          out.write_bytes(data)
          print(f'Launcher icon verified: {width}x{height}, {len(data)} bytes')
          PY

      - name: Build debug APK
        run: gradle -p android/CampTransferRemote :app:assembleDebug --no-daemon

      - name: Verify launcher artwork inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/CampTransferRemote/app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" res/drawable-nodpi-v4/turtle_transfer_launcher.png > /tmp/turtle_transfer_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('/tmp/turtle_transfer_launcher.png')
          data = p.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('APK launcher resource is not a valid PNG')
          width, height = struct.unpack('>II', data[16:24])
          print(f'APK contains Turtle Transfer launcher artwork: {width}x{height}, {len(data)} bytes')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurtleTransfer-Remote-Android
          path: android/CampTransferRemote/app/build/outputs/apk/debug/app-debug.apk
