name: Build Turtle Transfer Remote Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify checked-in Turtle Transfer launcher icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('android/CampTransferRemote/app/src/main/res/mipmap-nodpi/turtle_transfer_launcher.png')
          data = p.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Launcher icon is not a valid PNG')
          width, height = struct.unpack('>II', data[16:24])
          if width < 128 or height < 128:
              raise SystemExit(f'Launcher icon too small: {width}x{height}')
          print(f'Using checked-in Turtle Transfer launcher artwork: {width}x{height}, {len(data)} bytes')
          PY

      - name: Build debug APK
        run: gradle -p android/CampTransferRemote :app:assembleDebug --no-daemon

      - name: Verify APK launcher icon mapping
        shell: bash
        run: |
          set -euo pipefail
          APK="android/CampTransferRemote/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -q "turtle_transfer_launcher" || {
            echo "APK manifest is not using the Turtle Transfer launcher icon"
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          apk = Path('android/CampTransferRemote/app/build/outputs/apk/debug/app-debug.apk')
          src = Path('android/CampTransferRemote/app/src/main/res/mipmap-nodpi/turtle_transfer_launcher.png').read_bytes()
          expected = hashlib.sha256(src).hexdigest()
          with zipfile.ZipFile(apk) as z:
              matches = [n for n in z.namelist() if n.endswith('/turtle_transfer_launcher.png') and '/mipmap-' in n]
              if not matches:
                  raise SystemExit('No Turtle Transfer mipmap launcher PNG found inside APK')
              if not any(hashlib.sha256(z.read(n)).hexdigest() == expected for n in matches):
                  raise SystemExit('APK launcher PNG does not match the approved artwork')
              print('APK launcher icon verified:', ', '.join(matches))
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurtleTransfer-Remote-Android
          path: android/CampTransferRemote/app/build/outputs/apk/debug/app-debug.apk
